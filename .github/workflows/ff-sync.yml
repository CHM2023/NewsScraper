# ForexFactory forecasts. Consensus moves a few times a week, not hourly, so
# half-hourly is already generous; the diff means an unchanged feed writes
# nothing and sends nothing.
name: ff-sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # Two syncs racing would diff against the same pre-write state and send the
  # same NEW message twice.
  group: ff-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
      - name: ff_sync
        run: python -m fetchers.ff_sync
