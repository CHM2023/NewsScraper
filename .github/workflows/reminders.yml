# Every 15 minutes: send the 24-hour and 60-minute reminders that are due.
# The flags in the events table make this safe to run as often as we like.
name: reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping runs could both read the same un-flagged event and send it
  # twice, so serialise them.
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fetchers.reminders
