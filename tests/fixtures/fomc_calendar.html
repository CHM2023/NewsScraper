<!--
Trimmed copy of https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
markup, captured 2026-08-31. Only the structure the parser depends on is kept:
the "<year> FOMC Meetings" heading and the fomc-meeting__month /
fomc-meeting__date pairs.

The 2027 block deliberately includes a meeting that straddles a month boundary
("January/February", "31-1") so the parser's "take the last month and the last
day" rule is exercised. The real page has carried such rows in other years.
-->
