# Once a day: extend the 12-month skeleton, fill in yesterday's actuals, and
# load the latest prices (which also re-tags event regimes).
#
# Runs at 07:00 UTC - after the US close and before the 08:30 ET releases, so a
# release always has its actual by the time the trader looks at the page.
name: daily

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Load this many years of price history (blank = incremental)"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Ordered deliberately: the skeleton creates the rows, actuals fill them
      # in, prices supply the Fed funds history the regime tagging then reads.
      - name: calendar_skeleton
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m fetchers.calendar_skeleton

      - name: fred_actuals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m fetchers.fred_actuals

      - name: prices_daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BACKFILL_YEARS: ${{ github.event.inputs.backfill_years }}
        run: |
          if [ -n "$BACKFILL_YEARS" ]; then
            python -m fetchers.prices_daily --backfill-years "$BACKFILL_YEARS"
          else
            python -m fetchers.prices_daily
          fi
