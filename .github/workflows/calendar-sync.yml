# Hourly: pull this week's and next week's ForexFactory forecasts, diff them
# against Supabase, and push NEW / CHANGED messages for weight >= 4 events.
name: calendar-sync

on:
  schedule:
    # Top of every hour. Times are UTC; GitHub gives no guarantee of punctuality
    # under load, which is fine - ff_sync is idempotent and diff-driven.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  # Never let a slow run overlap the next one: two syncs racing would diff
  # against the same pre-write state and send duplicate messages.
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ff_sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m fetchers.ff_sync
